# Render.com blueprint. With DATABASE_URL set to Neon no disk is needed and the free plan works;
# without it the embedded database needs the persistent disk below (paid instance).
services:
  - type: web
    name: cm-dropship
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: dropship-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /app/data/pg
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_URL
        sync: false
      - key: SHOPIFY_STORE_DOMAIN
        sync: false
      - key: SHOPIFY_ADMIN_TOKEN
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
