# Run on any machine or VPS with Docker:  docker compose up -d
services:
  dropship:
    build: .
    restart: unless-stopped
    ports: ["3000:3000"]
    env_file: .env            # copy .env.example to .env and fill it in
    environment:
      DATABASE_PATH: /app/data/pg
    volumes:
      - dropship-data:/app/data
volumes:
  dropship-data:
